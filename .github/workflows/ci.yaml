name: Code Quality Check
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  quality:
    name: Lint, Format, and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Linting
        run: npm run lint

      - name: Test Build
        run: npm run build
